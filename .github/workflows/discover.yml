name: Discover videos

on:
  schedule:
    - cron: '17 6 * * 0'   # Sundays, 06:17 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'videos = new uploads from approved channels; expand = look for similar channels'
        type: choice
        options: [videos, expand]
        default: videos
      dry_run:
        description: 'Print the result without changing anything'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run discovery
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode || 'videos' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/discover.mjs

      - name: Open a review pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "global.window={};require('./videos.js');console.log('videos.js loads, ' + window.WANDERSPACE_VIDEOS.length + ' videos')"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            exit 0
          fi
          branch="review/$(date -u +%Y-%m-%d-%H%M)"
          git config user.name "wanderspace-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Discovery: new picks to review"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Weekly picks to review" \
            --body "Nothing is live until you merge. Vercel builds a preview of this branch so you can see the picks on the site first. Tell Claude which ones to drop, or merge as is." \
            || echo "Open the pull request here: https://github.com/${{ github.repository }}/compare/main...$branch"
