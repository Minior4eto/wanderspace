name: Discover videos

on:
  schedule:
    - cron: '17 6 * * 0'   # Sundays, 06:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the picks without changing videos.js'
        type: boolean
        default: false

permissions:
  contents: write
  models: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Find new videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/discover.mjs

      - name: Check the file still loads and commit
        run: |
          node -e "global.window={};require('./videos.js');console.log('videos.js loads, ' + window.WANDERSPACE_VIDEOS.length + ' videos')"
          if git diff --quiet -- videos.js; then
            echo "No changes."
            exit 0
          fi
          git config user.name "wanderspace-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Add new videos from weekly discovery"
          git push
