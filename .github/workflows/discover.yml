name: Discover videos

on:
  schedule:
    - cron: '17 6 * * *'   # every day, 06:17 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'videos = new uploads from approved channels; expand = look for similar channels'
        type: choice
        options: [videos, expand]
        default: videos
      max:
        description: 'Most videos to add in this run (videos mode)'
        default: '3'
      dry_run:
        description: 'Print the result without changing anything'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  models: read

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run discovery
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODE: ${{ inputs.mode || 'videos' }}
          MAX_PER_RUN: ${{ inputs.max || '3' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        shell: bash
        run: node scripts/discover.mjs 2>&1 | tee "$RUNNER_TEMP/run.log"

      - name: Check the file still loads
        run: node -e "global.window={};require('./videos.js');console.log('videos.js loads, ' + window.WANDERSPACE_VIDEOS.length + ' videos')"

      - name: Decide how to publish
        id: gate
        run: echo "auto=$(node -p "require('./channels.json').autoPublish === true")" >> "$GITHUB_OUTPUT"

      # With autoPublish on in channels.json, judged videos go straight onto the site.
      - name: Publish new videos
        if: ${{ (inputs.mode || 'videos') == 'videos' && steps.gate.outputs.auto == 'true' }}
        run: |
          if git diff --quiet -- videos.js; then
            echo "No changes."
            exit 0
          fi
          git config user.name "wanderspace-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Add new videos"
          git pull --rebase origin main
          git push

      # Otherwise (and for channel suggestions) the result goes to a pull request you can look at first.
      - name: Open a pull request to review
        if: ${{ !((inputs.mode || 'videos') == 'videos' && steps.gate.outputs.auto == 'true') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            exit 0
          fi
          branch="review/$(date -u +%Y-%m-%d-%H%M)"
          git config user.name "wanderspace-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Discovery: picks to review"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Picks to review" \
            --body "Nothing is live until you merge. Vercel builds a preview of this branch so you can see the picks on the site first. Tell Claude which ones to drop." \
            || echo "Open the pull request here: https://github.com/${{ github.repository }}/compare/main...$branch"

      # Keeps the last run's log on its own branch so it can be read without opening Actions.
      - name: Save the log
        if: ${{ always() }}
        continue-on-error: true
        run: |
          cp "$RUNNER_TEMP/run.log" "$RUNNER_TEMP/keep.log" || echo "no log" > "$RUNNER_TEMP/keep.log"
          git config user.name "wanderspace-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan bot-log
          git rm -rfq . || true
          cp "$RUNNER_TEMP/keep.log" last-run.log
          git add last-run.log
          git commit -qm "Log of run ${{ github.run_number }}"
          git push -f origin bot-log
